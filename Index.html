<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>One Sketch Daily</title>

  <!-- Favicon -->
  <link rel="icon" href="/images/web-icon.svg" type="image/svg+xml">

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --orange1: #FF6A3D;
      --orange2: #FF8A5C;
      --white: #FFFFFF;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, var(--orange1), var(--orange2));
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow-x: hidden;
    }

    .container {
      max-width: 520px;
      padding: 24px;
      animation: fadeIn 1.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* LOGO */
    .logo {
      margin-bottom: 30px;
    }

    .logo img {
      width: 120px;
      opacity: 0.95;
    }

    .brand-text {
      margin-top: 12px;
      font-size: 0.7rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.7;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 500;
      margin-bottom: 25px;
    }

    /* FORM */
    .form-box {
      margin-top: 25px;
      padding: 20px;
      border-radius: 20px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    }

    .form-box input,
    .form-box textarea {
      width: 100%;
      margin-bottom: 12px;
      padding: 12px;
      border-radius: 10px;
      border: none;
      outline: none;
      font-size: 0.9rem;
      background: rgba(255,255,255,0.15);
      color: white;
    }

    .form-box input::placeholder,
    .form-box textarea::placeholder {
      color: rgba(255,255,255,0.6);
    }

    .form-box textarea {
      resize: none;
      height: 80px;
    }

    .form-box button {
      width: 100%;
      padding: 12px;
      border-radius: 30px;
      border: none;
      background: white;
      color: #FF6A3D;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .form-box button:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    }

    .links {
      margin-top: 20px;
      font-size: 0.8rem;
      opacity: 0.65;
    }

    /* SUCCESS MESSAGE */
    .success {
      margin-top: 15px;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.4s ease;
      font-size: 0.9rem;
    }

    .success.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* MARK EFFECT */
    .mark {
      position: absolute;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(4px);
      animation: stamp 0.5s ease;
    }

    @keyframes stamp {
      from { transform: scale(0.3); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* FLOATING STAR */
    .sketch {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      opacity: 0.12;
      font-size: 40px;
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%,100% { transform: translate(-50%, 0); }
      50% { transform: translate(-50%, -12px); }
    }

  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      <img src="/images/Logo-white.svg" alt="logo">
      <div class="brand-text">One Sketch Daily</div>
    </div>

    <h1>Something is taking shape.</h1>

    <!-- NETLIFY FORM -->
    <form name="contact" method="POST" data-netlify="true" onsubmit="handleSubmit(event)">
      <input type="hidden" name="form-name" value="contact">

      <div class="form-box">
        <input type="text" name="name" placeholder="Your name" required>
        <input type="email" name="email" placeholder="Your email" required>
        <textarea name="message" placeholder="Leave a message..."></textarea>
        <button type="submit" id="submitBtn">Leave your mark →</button>
      </div>
    </form>

    <div id="successMessage" class="success">
      Your mark is now part of the journey.
    </div>

    <div class="links">
      A mark is about to be made.
    </div>

  </div>

  <div class="sketch">✦</div>

  <script>
    function handleSubmit(e) {
      e.preventDefault();

      const form = e.target;
      const data = new FormData(form);
      const btn = document.getElementById("submitBtn");

      btn.innerText = "Sending...";
      btn.disabled = true;

      fetch("/", {
        method: "POST",
        body: data
      })
      .then(() => {
        form.reset();
        btn.innerText = "Sent ✓";

        document.getElementById("successMessage").classList.add("show");

        createMark();
      })
      .catch(() => {
        btn.innerText = "Try again";
        btn.disabled = false;
      });
    }

    function createMark() {
      const mark = document.createElement("div");
      mark.classList.add("mark");

      mark.style.top = Math.random() * window.innerHeight + "px";
      mark.style.left = Math.random() * window.innerWidth + "px";

      document.body.appendChild(mark);
    }
  </script>

</body>
</html>
